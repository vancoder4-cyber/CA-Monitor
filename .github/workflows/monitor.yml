name: CA Monitor

# 定时使用 America/New_York，美股常规时段 9:30–16:00 ET,每个交易日扫 3 次:
#   开盘后 9:35 ET、盘中 12:45 ET、收盘后 16:05 ET。
on:
  # 合入 main 后立即刷新 Pages / Lark，避免代码与问答 Bot 已更新、公开快照却仍
  # 等下一次定时扫描。PR 的 CI 会在合并前先验证同一提交；这里负责生产发布。
  push:
    branches: [main]
    # Bot 写回先追加审计日志、再提交真正的生效状态。只改日志/需求队列时不跑
    # 整套生产监控；随后 acknowledged / forecast / filing resolution 的提交仍会触发。
    paths-ignore:
      - "data/ack_log.json"
      - "requests.md"
  schedule:
    - cron: "35 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "45 12 * * 1-5"
      timezone: "America/New_York"
    - cron: "5 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch: {}        # 允许手动触发

permissions:
  contents: read    # 只读;state 用缓存持久化,不再提交到仓库(避免和你手动推送抢分支)
  pages: write      # 部署 Pages
  id-token: write

concurrency:
  group: ca-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 指令一致性检查(COMMANDS / bot / HELP / README)
        run: python tools/check_commands.py

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 定时配置与 Lark 投递回归检查
        run: python -m unittest discover -s tests -v

      - name: 统一引用与正式化回归检查
        run: python tools/check_surface_consistency.py

      # 去重状态使用独立且稳定的 cache version；以后增删行情/CIK 等辅助缓存路径时，
      # 不得再让 state.json 因 path hash 改变而丢失并重放全部历史事件。
      - name: 恢复核心去重状态
        id: restore_core_state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: ca-dedup-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ca-dedup-state-

      # 2026-09-03 一次性兼容迁移：先尝试含参考价的新版旧 bundle；若不存在，
      # 再尝试只有 state/cik 的旧 bundle。恢复成功后会在本轮末写入独立缓存。
      - name: 迁移新版旧缓存
        id: restore_legacy_bundle
        if: steps.restore_core_state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/cik_map.json
            data/reference_prices.json
          key: ca-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ca-state-

      - name: 迁移早期旧缓存
        id: restore_legacy_state
        if: steps.restore_core_state.outputs.cache-matched-key == '' && steps.restore_legacy_bundle.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/cik_map.json
          key: ca-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ca-state-

      - name: 验证核心去重状态
        env:
          CORE_CACHE_KEY: ${{ steps.restore_core_state.outputs.cache-matched-key }}
          BUNDLE_CACHE_KEY: ${{ steps.restore_legacy_bundle.outputs.cache-matched-key }}
          LEGACY_CACHE_KEY: ${{ steps.restore_legacy_state.outputs.cache-matched-key }}
        run: |
          if [[ -z "$CORE_CACHE_KEY" && -z "$BUNDLE_CACHE_KEY" && -z "$LEGACY_CACHE_KEY" ]]; then
            echo "::error::未恢复任何历史去重状态；为避免整批历史事件重放，本轮停止。"
            exit 1
          fi
          python tools/validate_state.py

      - name: 恢复辅助数据缓存
        id: restore_support_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cik_map.json
            data/reference_prices.json
          key: ca-support-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ca-support-

      - name: 抓取 + 核对 + 生成面板 + 推 Lark
        env:
          ALPHAVANTAGE: ${{ secrets.ALPHAVANTAGE }}
          FMP: ${{ secrets.FMP }}
          TIINGO: ${{ secrets.TIINGO }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SEC_UA: ${{ secrets.SEC_UA }}
          FINX_USER: ${{ secrets.FINX_USER }}
          FINX_PASS: ${{ secrets.FINX_PASS }}
          FINX_BASE: ${{ secrets.FINX_BASE }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          LARK_DASHBOARD_URL: ${{ vars.LARK_DASHBOARD_URL }}
          LARK_ALERT_SPOT_MENTION_OPEN_IDS: ${{ secrets.LARK_ALERT_SPOT_MENTION_OPEN_IDS }}
          LARK_ALERT_CONTRACT_MENTION_OPEN_IDS: ${{ secrets.LARK_ALERT_CONTRACT_MENTION_OPEN_IDS }}
          # 迁移期兜底；两个分组 Secret 均完成生产配置后可删除。
          LARK_ALERT_MENTION_OPEN_IDS: ${{ secrets.LARK_ALERT_MENTION_OPEN_IDS }}
          LARK_REQUIRED: "1"
        run: python run.py

      - name: 校验公开 Pages 数据契约与脱敏
        run: >-
          python tools/validate_public_snapshot.py site_data.json
          --expected-sha "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID"

      # run.py 只有在生产投递成功后才退出 0；因此这里保存的 state 与已发送提醒一致。
      - name: 保存核心去重状态
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: ${{ steps.restore_core_state.outputs.cache-primary-key }}

      - name: 保存辅助数据缓存
        uses: actions/cache/save@v4
        with:
          path: |
            data/cik_map.json
            data/reference_prices.json
          key: ${{ steps.restore_support_cache.outputs.cache-primary-key }}

      - name: 准备 Pages 站点
        run: |
          test -s dashboard.html
          test -s site_data.json
          mkdir -p public
          cp dashboard.html public/index.html
          cp site_data.json public/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
