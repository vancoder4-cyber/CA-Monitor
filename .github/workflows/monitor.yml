name: CA Monitor

# 定时(cron 用 UTC)。美股常规时段 9:30–16:00 ET,每个交易日扫 3 次:
#   开盘后 9:35 ET、盘中 12:45 ET、收盘后 16:05 ET。
# cron 没有时区，夏令时/冬令时各排一次；schedule_gate 只放行真正落在 ET 目标窗口的一次。
on:
  schedule:
    - cron: "35 13 * * 1-5"   # EDT 09:35 / EST 08:35
    - cron: "35 14 * * 1-5"   # EST 09:35 / EDT 10:35
    - cron: "45 16 * * 1-5"   # EDT 12:45 / EST 11:45
    - cron: "45 17 * * 1-5"   # EST 12:45 / EDT 13:45
    - cron: "5 20 * * 1-5"    # EDT 16:05 / EST 15:05
    - cron: "5 21 * * 1-5"    # EST 16:05 / EDT 17:05
  workflow_dispatch: {}        # 允许手动触发

permissions:
  contents: read    # 只读;state 用缓存持久化,不再提交到仓库(避免和你手动推送抢分支)
  pages: write      # 部署 Pages
  id-token: write

concurrency:
  group: ca-monitor
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          et=$((10#$(TZ=America/New_York date +%H%M)))
          if (( (et >= 935 && et <= 1034) || (et >= 1245 && et <= 1344) || (et >= 1605 && et <= 1704) )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "ET $et is inside a monitor window"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "ET $et is the DST companion schedule; skipping duplicate run"
          fi

  build:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 指令一致性检查(COMMANDS / bot / HELP / README)
        run: python tools/check_commands.py

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 统一引用与正式化回归检查
        run: python tools/check_surface_consistency.py

      # 跨运行持久化预警去重状态(用缓存,不提交到仓库)
      - name: 恢复 state 缓存
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/cik_map.json
          key: ca-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ca-state-

      - name: 抓取 + 核对 + 生成面板 + 推 Lark
        env:
          ALPHAVANTAGE: ${{ secrets.ALPHAVANTAGE }}
          FMP: ${{ secrets.FMP }}
          TIINGO: ${{ secrets.TIINGO }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SEC_UA: ${{ secrets.SEC_UA }}
          FINX_USER: ${{ secrets.FINX_USER }}
          FINX_PASS: ${{ secrets.FINX_PASS }}
          FINX_BASE: ${{ secrets.FINX_BASE }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          LARK_DASHBOARD_URL: ${{ vars.LARK_DASHBOARD_URL }}
        run: python run.py

      - name: 准备 Pages 站点
        run: |
          test -s dashboard.html
          test -s site_data.json
          mkdir -p public
          cp dashboard.html public/index.html
          cp site_data.json public/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
